name: Build WindowTrace

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\src\WindowTrace.App\WindowTrace.App.csproj

      - name: Build
        run: dotnet build .\src\WindowTrace.App\WindowTrace.App.csproj --no-restore --configuration Release

      - name: Restore tests
        run: dotnet restore .\tests\WindowTrace.Tests\WindowTrace.Tests.csproj

      - name: Test
        run: dotnet test .\tests\WindowTrace.Tests\WindowTrace.Tests.csproj --configuration Release --no-restore

      - name: Publish Windows x64 self-contained build
        run: dotnet publish .\src\WindowTrace.App\WindowTrace.App.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\WindowTrace-win-x64

      - name: Package publish output
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\WindowTrace-win-x64\* -DestinationPath .\artifacts\WindowTrace-win-x64.zip

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowTrace-win-x64
          path: .\artifacts\WindowTrace-win-x64.zip
          if-no-files-found: error
